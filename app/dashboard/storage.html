<div class="panel">
  <div class="panel-head">
    <p class="section-kicker">Persistence</p>
    <h2>Database</h2>
    <p>SQLite is local and zero-config. PostgreSQL-compatible databases are available for hosted deployments.</p>
  </div>

  <div id="storageStatus" class="storage-status">
    <div>
      <span class="label">Current backend</span>
      <strong id="currentBackend">Loading...</strong>
    </div>
    <span id="backendBadge" class="badge badge-purple">--</span>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="dbType">Database type</label>
      <select id="dbType" onchange="onDbTypeChange()">
        <option value="sqlite">SQLite (local)</option>
        <option value="postgres">PostgreSQL</option>
        <option value="supabase">Supabase</option>
        <option value="neon">Neon</option>
      </select>
    </div>

    <div class="form-group" id="connStrGroup">
      <label id="connStrLabel" for="pgConnectionString">Connection string</label>
      <div class="password-wrapper">
        <input type="password" id="pgConnectionString" placeholder="postgresql://user:password@host/database" autocomplete="off">
        <button type="button" class="password-toggle" onclick="toggleStoragePassword('pgConnectionString', this)">Show</button>
      </div>
      <div id="connStrExample" class="config-note"></div>
    </div>
  </div>

  <div class="button-group">
    <button type="button" class="secondary" onclick="testPgConnection()" id="testBtn">Test connection</button>
    <button type="button" class="primary" onclick="switchDatabase()" id="switchBtn">Switch database</button>
    <button type="button" class="danger" onclick="migrateToPostgres()" id="migrateBtn">Migrate data</button>
  </div>

  <div id="connectionResult" class="hidden"></div>
</div>
