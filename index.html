<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Stream Sprites — Admin Dashboard</title>
<style>
  :root{color-scheme:dark}
  body{font-family:system-ui,Arial;font-size:14px;background:#111;color:#fff;padding:20px;max-width:1400px;margin:0 auto}
  h2{font-size:20px;margin-top:0;margin-bottom:12px}
  p{font-size:14px;line-height:1.5}
  small{font-size:12px;color:#a0aec0}
  .panel{background:#222;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
  input,button,select{padding:10px 14px;margin:4px;background:#333;color:#fff;border:1px solid #555;border-radius:6px;font-size:14px;box-sizing:border-box}
  input::placeholder{color:#888}
  button{background:#0af;cursor:pointer;border:none;transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,box-shadow 0.2s;font-weight:600}
  button:focus-visible,.tab:focus-visible,.logout-btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0af;outline-offset:2px}
  button:hover{background:#0dc;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,170,255,0.3)}
  button:disabled{background:#555;cursor:not-allowed;transform:none;box-shadow:none}
  button.danger{background:#e53e3e}
  button.danger:hover{background:#f56565;box-shadow:0 4px 12px rgba(229,62,62,0.3)}
  button.secondary{background:#4a5568}
  button.secondary:hover{background:#718096}
  button.primary{background:#9146FF}
  button.primary:hover{background:#a370ff;box-shadow:0 4px 12px rgba(145,70,255,0.3)}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #333}
  th{background:#2d3748;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:0.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
  .stat-card{background:#2d3748;padding:16px;border-radius:8px;border-left:4px solid #0af}
  .error{color:#f44;margin:8px 0}
  .success{color:#0f0;margin:8px 0}
  .badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;background:#0af;color:#000;font-weight:600}
  textarea{width:100%;height:120px;font-family:monospace;background:#222;color:#fff;border:1px solid #555;border-radius:4px;padding:8px}
  .hidden{display:none}
  .skip-link{position:absolute;left:-9999px;top:8px;z-index:10000;background:#0af;color:#000;padding:8px 12px;border-radius:4px;font-weight:600;text-decoration:none}
  .skip-link:focus-visible{left:8px}

  /* Form layout styles */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:16px 0}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-weight:600;font-size:14px;color:#a0aec0}
  .form-group input{width:100%;margin:0}
  .password-wrapper{position:relative;display:flex;align-items:center}
  .password-wrapper input{width:100%;padding-right:36px}
  .password-toggle{position:absolute;right:8px;background:none;border:none;color:#888;cursor:pointer;font-size:11px;padding:4px;line-height:1}
  .password-toggle:hover{color:#fff}
  .button-group{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
  .button-group button{margin:0}
  .token-display{margin:16px 0;padding:12px;background:#2d3748;border-radius:6px;border:1px solid #4a5568}
  .token-display code{display:block;margin-top:8px;word-break:break-all;font-family:monospace;font-size:12px;color:#0af;background:#111;padding:8px;border-radius:4px}
  .connection-buttons{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}

  /* Header layout */
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;position:relative}
  .header-left{flex:1}
  .header-right{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px}
  .logout-btn{padding:8px 14px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:6px;font-size:13px;cursor:pointer}
  .logout-btn:hover{background:#333;color:#fff;border-color:#666;transform:none;box-shadow:none}
  .page-title{margin:0 0 8px 0;font-size:28px;font-weight:700;background:linear-gradient(135deg,#0af,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .page-subtitle{margin:0;color:#888;font-size:14px}

  /* Tab styles */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;border-bottom:2px solid #333;padding-bottom:10px}
  .tab{background:#333;color:#fff;padding:10px 20px;margin:0;font-weight:500;border-radius:6px 6px 0 0;cursor:pointer;border:1px solid #555;border-bottom:none;transition:background-color 0.2s,color 0.2s,border-color 0.2s}
  .tab:hover{background:#444;transform:none;box-shadow:none}
  .tab.active{background:#0af;border-color:#0af;color:#000;font-weight:600}
  .tab-content{display:none}
  .tab-content.active{display:block}

  /* Quick actions grid */
  .actions-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .action-card{background:#2d3748;padding:16px;border-radius:8px;cursor:pointer;transition:background-color 0.2s,border-color 0.2s,transform 0.2s,box-shadow 0.2s;border:2px solid transparent}
  .action-card:hover{background:#3d4758;border-color:#0af;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.3)}
  .action-card.danger:hover{border-color:#e53e3e}
  .action-card:focus-visible{outline:2px solid #0af;outline-offset:2px}
  .action-card .icon{font-size:32px;margin-bottom:8px}
  .action-card .title{font-weight:600;font-size:16px;margin-bottom:4px}
  .action-card .desc{font-size:13px;color:#a0aec0}

  /* Quick links */
  .links-container{display:flex;gap:8px;flex-wrap:wrap}
  .link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#2d3748;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;transition:background-color 0.2s,border-color 0.2s,transform 0.2s;border:1px solid #4a5568}
  .link-btn:hover{background:#3d4758;border-color:#0af;transform:translateY(-1px)}

  @media (prefers-reduced-motion: reduce){
    button,.tab,.action-card,.link-btn{transition:none}
    button:hover,.action-card:hover,.link-btn:hover{transform:none}
  }

  /* Footer credit */
  .footer-credit{
    position:fixed;
    bottom:12px;
    right:16px;
    font-size:13px;
    color:#888;
    background:rgba(17,17,17,0.8);
    padding:6px 12px;
    border-radius:6px;
    border:1px solid #333;
    z-index:1000;
  }
  .footer-credit a{
    color:#ff6b9d;
    text-decoration:none;
    font-weight:600;
  }
  .footer-credit a:hover{
    color:#ff8fab;
  }
</style>
   <!-- User Management Manager Scripts -->
   <script src="dashboard/dashboardUtils.js"></script>
   <script src="dashboard/userSkinAssignmentManager.js"></script>
   <script src="dashboard/userExclusionManager.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="header">
    <div class="header-left">
      <h1 class="page-title"><span style="user-select:none;font-size:1.3em">🎮</span> Stream Sprites</h1>
      <p class="page-subtitle">Admin Dashboard</p>
    </div>
    <div class="header-right">
      <button id="logoutBtn" class="logout-btn" type="button" onclick="logoutDashboard()">Log out</button>
      <div class="stat-card" style="min-width:200px;margin-bottom:0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <div style="color:#888;font-size:12px;text-transform:uppercase">Total Users</div>
            <div style="font-size:24px;font-weight:700" id="totalUsers">0</div>
          </div>
          <div>
            <div style="color:#888;font-size:12px;text-transform:uppercase">Custom Skins</div>
            <div style="font-size:24px;font-weight:700;color:#0af" id="customSkins">0</div>
          </div>
          <div>
            <div style="color:#888;font-size:12px;text-transform:uppercase">Default Skins</div>
            <div style="font-size:24px;font-weight:700;color:#718096" id="defaultSkins">0</div>
          </div>
          <div>
            <div style="color:#888;font-size:12px;text-transform:uppercase">Server Status</div>
            <div id="serverStatus" class="badge" style="display:inline-block;margin-top:4px">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="tabs" role="tablist" aria-label="Dashboard sections">
    <button type="button" class="tab active" role="tab" aria-selected="true" aria-controls="content" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="users" onclick="switchTab('users')">👥 Users</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="assets" onclick="switchTab('assets')">🎨 Assets</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="config" onclick="switchTab('config')">🟣 Twitch</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="deploy" onclick="switchTab('deploy')">🚀 Deploy</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="storage" onclick="switchTab('storage')">🗄️ Database</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="settings" onclick="switchTab('settings')">⚙️ Configuration</button>
    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="help" onclick="switchTab('help')">📝 Help</button>
  </div>

  <div id="content" role="tabpanel" aria-label="Section content" tabindex="-1">
    <!-- Tab content will be loaded dynamically -->
  </div>

  <div class="footer-credit">Made by <a href="https://github.com/SuperFurias" target="_blank">SuperFurias</a> with love</div>

  <script>
    const content = document.getElementById('content');
    let currentTab = 'dashboard';
    let loadedScripts = new Set();
    let tabLoadSequence = 0;

    document.querySelector('.tabs').addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabs = Array.from(document.querySelectorAll('.tab'));
      const index = tabs.indexOf(document.activeElement);
      if (index === -1) return;
      event.preventDefault();
      let nextIndex = index;
      if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
      if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
      if (event.key === 'Home') nextIndex = 0;
      if (event.key === 'End') nextIndex = tabs.length - 1;
      tabs[nextIndex].focus();
      switchTab(tabs[nextIndex].dataset.tab);
    });

    function isValidTab(tabId) {
      return !!tabId && Array.from(document.querySelectorAll('.tab')).some(tab => tab.dataset.tab === tabId);
    }

    function tabIdFromHash() {
      const raw = location.hash.slice(1);
      if (!raw) return null;
      try { return decodeURIComponent(raw); } catch (e) { return raw; }
    }

    window.addEventListener('hashchange', () => {
      const tabId = tabIdFromHash();
      if (tabId === 'content') {
        document.getElementById('content')?.focus();
        history.replaceState(null, '', `#${currentTab}`);
        return;
      }
      if (isValidTab(tabId) && tabId !== currentTab) switchTab(tabId);
    });

    // Tab switching with dynamic loading
    async function switchTab(tabId) {
      currentTab = tabId;
      const loadSequence = ++tabLoadSequence;
      if (location.hash !== `#${tabId}`) {
        history.replaceState(null, '', `#${tabId}`);
      }

      // Update active state and accessibility attributes on all tabs.
      document.querySelectorAll('.tab').forEach(tab => {
        const isActive = tab.dataset.tab === tabId;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
      });

      // Load content for the tab
      try {
        const response = await fetch(`dashboard/${tabId}.html`);
        if (!response.ok) {
          throw new Error(`Failed to load ${tabId} tab`);
        }
        const html = await response.text();
        if (loadSequence !== tabLoadSequence) return;
        content.innerHTML = html;

        // Associate labels with their adjacent form controls in tab markup.
        content.querySelectorAll('label').forEach((label) => {
          const control = label.parentElement?.querySelector('input, select, textarea');
          if (control?.id && !label.htmlFor) label.htmlFor = control.id;
        });

        // Load tab-specific JavaScript file if not already loaded
        if (!loadedScripts.has(tabId)) {
          console.log(`Loading script: dashboard/${tabId}.js`);
          await loadScript(`dashboard/${tabId}.js`);
          loadedScripts.add(tabId);
          console.log(`Script loaded: dashboard/${tabId}.js`);
        }

        if (loadSequence !== tabLoadSequence) return;

        // Initialize tab-specific JavaScript
        console.log(`Checking initializer for: ${tabId}`);
        console.log('Available initializers:', window.tabInitializers);
        if (window.tabInitializers && window.tabInitializers[tabId]) {
          console.log(`Calling initializer for: ${tabId}`);
          await window.tabInitializers[tabId]();
        } else {
          console.warn(`No initializer found for: ${tabId}`);
        }
      } catch (e) {
        content.innerHTML = `<div class="panel error">Error loading tab: ${e.message}</div>`;
        console.error('Tab loading error:', e);
      }
    }

    // Dynamically load a script file
    function loadScript(src) {
      console.log(`Attempting to load script: ${src}`);
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => {
          console.log(`Script loaded successfully: ${src}`);
          resolve();
        };
        script.onerror = (err) => {
          console.error(`Failed to load script: ${src}`, err);
          reject(err);
        };
        document.head.appendChild(script);
      });
    }

// Load initial tab on page load
(async ()=>{
  console.log('Page loaded, starting initial tab load...');

  // Check if localhost and hide Deploy tab if not
  try {
    const res = await fetch('/env');
    if (res.ok) {
      const cfg = await res.json();
      if (!cfg.isLocalhost) {
        const deployTab = document.querySelector('.tab[data-tab="deploy"]');
        if (deployTab) deployTab.style.display = 'none';
      }
    }
  } catch (e) {
    console.warn('Failed to check localhost status:', e);
  }

  const initialTab = tabIdFromHash();
  await switchTab(isValidTab(initialTab) ? initialTab : 'dashboard');
  console.log('Dashboard tab loaded, refreshing stats...');
  await refreshStatsHTTP();
})();

    // Auto-refresh stats: prefer WebSocket, fall back to HTTP polling
    let statsWs = null;
    let statsPollInterval = null;

    function updateStatsUI(stats) {
      document.getElementById('totalUsers').textContent = stats.total_users || 0;
      document.getElementById('customSkins').textContent = stats.custom_skins || 0;
      document.getElementById('defaultSkins').textContent = stats.default_skins || 0;
      document.getElementById('serverStatus').textContent = 'Online';
      document.getElementById('serverStatus').style.background = '#0f0';
    }

    function startStatsPolling() {
      if (statsPollInterval) return;
      statsPollInterval = setInterval(refreshStatsHTTP, 30000); // Fallback: poll every 30s
    }

    function stopStatsPolling() {
      if (statsPollInterval) {
        clearInterval(statsPollInterval);
        statsPollInterval = null;
      }
    }

    async function refreshStatsHTTP() {
      try {
        const res = await fetch('/api/stats');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        const stats = await res.json();
        updateStatsUI(stats);
      } catch (e) {
        document.getElementById('serverStatus').textContent = 'Offline';
        document.getElementById('serverStatus').style.background = '#f44';
      }
    }

    // Try WebSocket for real-time stats
    function connectStatsWebSocket() {
      try {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        statsWs = new WebSocket(`${protocol}//${location.host}`);
        statsWs.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'stats') {
              updateStatsUI(data.data);
              stopStatsPolling(); // WebSocket is working, stop HTTP polling
            } else if (data.type === 'chat') {
              if (typeof window.onTwitchChat === 'function') {
                window.onTwitchChat(data.username, data.message);
              }
            }
          } catch (e) { /* ignore non-JSON messages */ }
        };
    statsWs.onopen = () => {
      statsWs.send(JSON.stringify({ type: 'identify', clientType: 'dashboard' }));
      refreshStatsHTTP(); // Get initial stats immediately
    };
        statsWs.onclose = () => {
          startStatsPolling(); // WebSocket closed, fall back to polling
          // Try to reconnect after 5s
          setTimeout(connectStatsWebSocket, 5000);
        };
        statsWs.onerror = () => {
          startStatsPolling();
        };
      } catch (e) {
        startStatsPolling();
      }
    }

// Initialize: try WebSocket first, only start polling if WS fails
connectStatsWebSocket();

    async function logoutDashboard() {
      try {
        await fetch('/api/dashboard/logout', { method: 'POST' });
      } catch (e) {
        // Even if the request fails, return to the auth page.
      }
      window.location.href = '/';
    }

    // Announce dashboard presence to prevent duplicate browser opens
    let pingInterval;
    async function announceDashboard(){
      try{
        const res = await fetch('/api/dashboard/ping', { method: 'GET' });
        const data = await res.json();
        // If server signals to stop pinging, clear the interval
        if(data.stopPinging){
          console.log('Dashboard already detected by server, stopping presence pings');
          clearInterval(pingInterval);
          pingInterval = null;
        }
      }catch(e){
        // Silently fail - not critical
      }
    }

    // Ping every 2s until server detects us, then stop (reduced from 100ms to save bandwidth)
    pingInterval = setInterval(announceDashboard, 2000);
    // Initial ping
    announceDashboard();

    // Shared API helper
    async function api(path, opts={}){
      const res = await fetch(path, {
        ...opts,
        headers: {
          ...(opts.headers || {}),
          'Content-Type': 'application/json'
        }
      });
      if (res.status === 401) {
        window.location.href = '/';
        throw new Error('Session expired');
      }
      const contentType = res.headers.get('content-type');
      if(contentType && contentType.includes('application/json')){
        return await res.json();
      } else {
        const text = await res.text();
        if(!res.ok) throw new Error(text);
        return { result: text };
      }
    }

    // Shared functions available to all tabs
    window.tabInitializers = {};
    window.sharedAPI = api;
  </script>
</body>
</html>
