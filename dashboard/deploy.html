<style>
  .deploy-card {
    background: #222;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .deploy-card h2 {
    margin-top: 0;
    font-size: 20px;
  }
  .deploy-card p {
    color: #a0aec0;
    font-size: 14px;
    line-height: 1.5;
  }
  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0;
  }
  .status-indicator.running { background: rgba(0,255,0,0.1); color: #0f0; }
  .status-indicator.stopped { background: rgba(255,255,255,0.1); color: #888; }
  .status-indicator.starting { background: rgba(255,200,0,0.1); color: #fc0; }
  .status-indicator.error { background: rgba(255,0,0,0.1); color: #f44; }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.running { background: #0f0; box-shadow: 0 0 6px #0f0; }
  .status-dot.stopped { background: #555; }
  .status-dot.starting { background: #fc0; animation: pulse 1s infinite; }
  .status-dot.error { background: #f44; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .url-display {
    background: #111;
    border: 1px solid #4a5568;
    border-radius: 6px;
    padding: 12px;
    margin: 12px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  .url-display a {
    color: #0af;
    word-break: break-all;
    flex: 1;
    text-decoration: none;
    font-family: monospace;
    font-size: 13px;
  }
  .url-display a:hover { text-decoration: underline; }
  .copy-btn {
    background: #4a5568;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .copy-btn:hover { background: #5a6578; }
  .deploy-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .deploy-actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .deploy-actions button:hover { transform: translateY(-1px); }
</style>

<div class="deploy-card">
  <h2>Cloudflare Tunnel</h2>
  <p>Creates a secure HTTPS tunnel to your local server. Use the URL as a Browser Source in OBS. Free, no account needed. The URL changes each restart.</p>

  <div id="tunnelStatus" class="status-indicator stopped">
    <span class="status-dot stopped"></span> Stopped
  </div>

  <div class="url-display" id="tunnelUrlDisplay" style="display:none">
    <a id="tunnelUrl" href="#" target="_blank"></a>
    <button class="copy-btn" onclick="copyTunnelUrl()">Copy</button>
  </div>

  <div id="tunnelError" style="color:#f44;font-size:13px;margin:8px 0;display:none"></div>

  <div class="deploy-actions">
    <button id="startTunnelBtn" onclick="startTunnel()" style="background:#0af;color:#000">Start Tunnel</button>
    <button id="stopTunnelBtn" onclick="stopTunnel()" style="background:#e53e3e;color:#fff;display:none">Stop Tunnel</button>
  </div>
</div>
