<div class="panel">
  <h2 style="margin-top:0">🎨 Assets</h2>
  <p>All assets organized by folder. Upload files to any folder, or create new ones.</p>

  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    <select id="assetFolderSelect" style="background:#333;color:#fff;border:1px solid #555;border-radius:6px;padding:10px 14px;font-size:14px">
      <option value="skins">skins</option>
    </select>
    <input type="file" id="assetFileInput" accept=".png,.gif,.jpg,.jpeg,.webp,.webm,.avif" style="background:#333;color:#fff;border:1px solid #555;border-radius:6px;padding:8px">
    <button onclick="uploadAsset()" id="uploadBtn">Upload</button>
  </div>

  <div id="assetContainer"></div>
</div>
