<div class="panel">
  <h2>🔑 Twitch OAuth Setup</h2>
  <p>Generate a bot OAuth token using your Twitch Developer credentials.</p>
  
  <div class="form-grid">
    <div class="form-group">
      <label for="clientId">Client ID</label>
      <input id="clientId" type="text" placeholder="your_twitch_client_id_here">
    </div>
    
    <div class="form-group">
      <label for="clientSecret">Client Secret</label>
      <input id="clientSecret" type="password" placeholder="your_twitch_client_secret_here">
    </div>
    
    <div class="form-group">
      <label for="botUsername">Bot Username</label>
      <input id="botUsername" type="text" placeholder="your_bot_name_here">
    </div>
    
    <div class="form-group">
      <label for="channel">Channel</label>
      <input id="channel" type="text" placeholder="your_channel">
    </div>
  </div>
  
  <div class="button-group">
    <button id="saveConfig" onclick="saveConfig()">💾 Save Config</button>
    <button id="generateOAuth" onclick="generateOAuth()">🔑 Generate OAuth Token</button>
  </div>
  
  <div id="oauthStatus" class="error"></div>
  <div id="oauthSuccess" class="success"></div>
  
  <div class="token-display">
    <strong>Current Token:</strong>
    <code id="currentToken">--</code>
  </div>
  
  <div class="connection-buttons">
    <button id="connectTwitchBtn" onclick="connectTwitch()" class="primary">🔗 Connect to Twitch</button>
    <button id="disconnectTwitchBtn" onclick="disconnectTwitch()" class="danger">✖ Disconnect</button>
  </div>
  
  <div id="twitchStatus" class="error"></div>
</div>
