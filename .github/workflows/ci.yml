name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and HTTP integration tests
        run: npm test

      - name: Live-server soak test
        run: npm run soak

      - name: Dependency audit
        run: npm audit --audit-level=high

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: streamsprites
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streamsprites"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL storage tests
        env:
          TEST_POSTGRES_URL: postgresql://postgres:testpass@127.0.0.1:5432/streamsprites
        run: npm run test:postgres
